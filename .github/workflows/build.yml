name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        run: pio run -e fancoil

      - name: Size gate (must fit the 896 KB OTA slot)
        run: |
          BIN=.pio/build/fancoil/firmware.bin
          SIZE=$(stat -c%s "$BIN")
          LIMIT=$((896 * 1024))
          echo "firmware.bin = $SIZE bytes (limit $LIMIT)"
          cp "$BIN" firmware.bin
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::firmware.bin ($SIZE B) exceeds the 896 KB OTA slot"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware.bin

      # --- release (tag v*) : publish firmware.bin + latest.json for OTA ---
      - name: Build release manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/firmware.bin",
            "notes": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          }
          EOF
          cat latest.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware.bin
            latest.json
