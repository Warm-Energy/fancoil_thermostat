; FanCoil.co.uk thermostat — ESP32-C2 firmware (ESP-IDF, lean for the 896 KB OTA slot).
; Local control via a tiny HTTP/JSON API + mDNS; the FanCoil.co.uk Home Assistant
; integration discovers and controls it (no on-device MQTT, to save flash). Own OTA.
;
; ESP32-C2 ESP-IDF support comes from the community pioarduino platform fork
; (pin a release: https://github.com/pioarduino/platform-espressif32/releases).

[platformio]
default_envs = fancoil

[env:fancoil]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c2-devkitm-1
framework = espidf
board_build.flash_size = 2MB
board_upload.flash_size = 2MB                      ; also stamp 2MB into the image header
board_build.partitions = partitions_2mb_ota.csv   ; dual-OTA layout (ota_0/ota_1)
monitor_speed = 115200
build_flags =
    -Os                              ; optimize for size — must fit the 896 KB slot
